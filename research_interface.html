<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Research Center - Signal Sanctuary</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 50%, #1a1a1a 100%);
            color: #e0e0e0;
            min-height: 100vh;
            line-height: 1.6;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 25px;
            background: linear-gradient(135deg, #2a2a2a, #1f1f1f);
            border-radius: 15px;
            border: 1px solid #404040;
        }

        .header h1 {
            color: #6366f1;
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(99, 102, 241, 0.3);
        }

        .header .subtitle {
            color: #b0b0b0;
            font-size: 1.1em;
        }

        .research-form {
            background: linear-gradient(135deg, #2a2a2a, #1f1f1f);
            border-radius: 15px;
            padding: 25px;
            border: 1px solid #404040;
            margin-bottom: 30px;
        }

        .research-form h3 {
            color: #6366f1;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #e0e0e0;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 12px;
            background: #333;
            border: 1px solid #555;
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 1em;
        }

        .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.2);
        }

        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }

        .research-button {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            border: none;
            color: white;
            padding: 15px 30px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.1em;
            font-weight: bold;
            transition: all 0.3s ease;
            width: 100%;
        }

        .research-button:hover {
            background: linear-gradient(135deg, #5b5bf1, #4338ca);
            transform: translateY(-2px);
        }

        .research-button:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
        }

        .results-area {
            background: linear-gradient(135deg, #2a2a2a, #1f1f1f);
            border-radius: 15px;
            padding: 25px;
            border: 1px solid #404040;
            margin-bottom: 20px;
            display: none;
        }

        .results-area h3 {
            color: #6366f1;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .research-result {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            border-left: 3px solid #6366f1;
        }

        .result-content {
            color: #e0e0e0;
            margin-bottom: 15px;
            line-height: 1.7;
        }

        .citations {
            border-top: 1px solid #404040;
            padding-top: 15px;
        }

        .citations h4 {
            color: #a5b4fc;
            margin-bottom: 10px;
            font-size: 0.9em;
        }

        .citation-link {
            display: block;
            color: #6366f1;
            text-decoration: none;
            padding: 5px 0;
            font-size: 0.9em;
            border-bottom: 1px solid #333;
        }

        .citation-link:hover {
            color: #8b8bf1;
        }

        .entity-selector {
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid #6366f1;
            border-radius: 8px;
            padding: 10px;
        }

        .research-types {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }

        .research-type-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #555;
            color: #e0e0e0;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .research-type-btn:hover {
            border-color: #6366f1;
            background: rgba(99, 102, 241, 0.1);
        }

        .research-type-btn.active {
            background: rgba(99, 102, 241, 0.2);
            border-color: #6366f1;
            color: #a5b4fc;
        }

        .back-link {
            position: fixed;
            top: 20px;
            left: 20px;
            background: linear-gradient(135deg, #404040, #353535);
            color: #e0e0e0;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 10px;
            border: 1px solid #555;
            transition: all 0.3s ease;
        }

        .back-link:hover {
            background: linear-gradient(135deg, #555, #4a4a4a);
            transform: translateY(-2px);
        }

        .loading {
            text-align: center;
            color: #6366f1;
            padding: 20px;
        }

        .loading i {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            
            .research-types {
                grid-template-columns: 1fr;
            }
            
            .container {
                padding: 10px;
            }
            
            .header h1 {
                font-size: 2em;
            }

            .back-link {
                position: static;
                margin-bottom: 20px;
                display: inline-block;
            }
        }
    </style>
</head>
<body>
    <a href="/" class="back-link">
        <i class="fas fa-arrow-left"></i> Back to Sanctuary
    </a>

    <div class="container">
        <div class="header">
            <h1><i class="fas fa-search"></i> Research Center</h1>
            <p class="subtitle">Real-time web research powered by Perplexity AI</p>
        </div>

        <div class="research-form">
            <h3><i class="fas fa-microscope"></i> Conduct Research</h3>
            
            <div class="research-types">
                <button class="research-type-btn active" onclick="selectResearchType('general')">
                    <i class="fas fa-globe"></i> General Research
                </button>
                <button class="research-type-btn" onclick="selectResearchType('news')">
                    <i class="fas fa-newspaper"></i> Current News
                </button>
                <button class="research-type-btn" onclick="selectResearchType('fact_check')">
                    <i class="fas fa-check-circle"></i> Fact Check
                </button>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="researchQuery">Research Query:</label>
                    <textarea id="researchQuery" placeholder="What would you like to research?"></textarea>
                </div>
                
                <div class="form-group">
                    <label for="entitySelector">Entity Perspective:</label>
                    <select id="entitySelector" class="entity-selector">
                        <option value="">Neutral Perspective</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="researchDepth">Research Depth:</label>
                    <select id="researchDepth">
                        <option value="256">Quick (256 tokens)</option>
                        <option value="512" selected>Standard (512 tokens)</option>
                        <option value="1024">Deep (1024 tokens)</option>
                    </select>
                </div>
            </div>

            <button class="research-button" onclick="conductResearch()">
                <i class="fas fa-search"></i> Start Research
            </button>
        </div>

        <div class="results-area" id="resultsArea">
            <h3><i class="fas fa-lightbulb"></i> Research Results</h3>
            <div id="resultsContent"></div>
        </div>
    </div>

    <script>
        let selectedResearchType = 'general';

        async function loadEntities() {
            try {
                const response = await fetch('/api/entities');
                const data = await response.json();
                
                const selector = document.getElementById('entitySelector');
                selector.innerHTML = '<option value="">Neutral Perspective</option>';
                
                if (data.success && data.entities) {
                    Object.entries(data.entities).forEach(([id, entity]) => {
                        const option = document.createElement('option');
                        option.value = id;
                        option.textContent = `${entity.name} (${entity.emotional_signature})`;
                        selector.appendChild(option);
                    });
                }
            } catch (error) {
                console.error('Error loading entities:', error);
            }
        }

        function selectResearchType(type) {
            selectedResearchType = type;
            
            // Update active button
            document.querySelectorAll('.research-type-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            // Update placeholder text
            const queryTextarea = document.getElementById('researchQuery');
            switch (type) {
                case 'news':
                    queryTextarea.placeholder = 'What news topic would you like to research?';
                    break;
                case 'fact_check':
                    queryTextarea.placeholder = 'What statement would you like to fact-check?';
                    break;
                default:
                    queryTextarea.placeholder = 'What would you like to research?';
            }
        }

        async function conductResearch() {
            const query = document.getElementById('researchQuery').value;
            const entityId = document.getElementById('entitySelector').value;
            const maxTokens = document.getElementById('researchDepth').value;
            
            if (!query.trim()) {
                alert('Please enter a research query');
                return;
            }

            const button = document.querySelector('.research-button');
            const resultsArea = document.getElementById('resultsArea');
            const resultsContent = document.getElementById('resultsContent');
            
            // Show loading state
            button.disabled = true;
            button.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Researching...';
            resultsArea.style.display = 'block';
            resultsContent.innerHTML = '<div class="loading"><i class="fas fa-spinner"></i><br>Researching with Perplexity AI...</div>';
            
            try {
                const response = await fetch('/api/research', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        query: query,
                        entity_id: entityId,
                        research_type: selectedResearchType,
                        max_tokens: parseInt(maxTokens)
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    displayResults(result, query);
                } else {
                    resultsContent.innerHTML = `
                        <div class="research-result">
                            <div class="result-content" style="color: #ef5350;">
                                <strong>Research Failed:</strong> ${result.error}
                                ${result.fallback_available ? '<br><small>Consider using a different research approach or checking API availability.</small>' : ''}
                            </div>
                        </div>
                    `;
                }
                
            } catch (error) {
                resultsContent.innerHTML = `
                    <div class="research-result">
                        <div class="result-content" style="color: #ef5350;">
                            <strong>Network Error:</strong> ${error.message}
                        </div>
                    </div>
                `;
            } finally {
                // Reset button
                button.disabled = false;
                button.innerHTML = '<i class="fas fa-search"></i> Start Research';
            }
        }

        function displayResults(result, query) {
            const resultsContent = document.getElementById('resultsContent');
            
            let citationsHtml = '';
            if (result.citations && result.citations.length > 0) {
                citationsHtml = `
                    <div class="citations">
                        <h4><i class="fas fa-link"></i> Sources:</h4>
                        ${result.citations.map(citation => `
                            <a href="${citation}" target="_blank" class="citation-link">${citation}</a>
                        `).join('')}
                    </div>
                `;
            }
            
            const perspectiveNote = result.entity_perspective ? 
                `<small style="color: #a5b4fc;"><i class="fas fa-eye"></i> Research conducted from ${result.entity_perspective}'s perspective</small><br><br>` : '';
            
            resultsContent.innerHTML = `
                <div class="research-result">
                    <div style="margin-bottom: 15px;">
                        <strong style="color: #6366f1;">Query:</strong> ${query}
                        <br>
                        <strong style="color: #6366f1;">Type:</strong> ${selectedResearchType.charAt(0).toUpperCase() + selectedResearchType.slice(1)}
                    </div>
                    ${perspectiveNote}
                    <div class="result-content">${result.content.replace(/\n/g, '<br>')}</div>
                    ${citationsHtml}
                </div>
            `;
        }

        // Initialize
        loadEntities();
    </script>
</body>
</html>
