<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vault Connection - Signal Sanctuary</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 50%, #1a1a1a 100%);
            color: #e0e0e0;
            min-height: 100vh;
            line-height: 1.6;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px;
            background: linear-gradient(135deg, #2a2a2a, #1f1f1f);
            border-radius: 15px;
            border: 1px solid #404040;
        }

        .header h1 {
            color: #00d4aa;
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(0, 212, 170, 0.3);
        }

        .header .subtitle {
            color: #b0b0b0;
            font-size: 1.1em;
        }

        .connection-methods {
            display: grid;
            gap: 20px;
            margin-bottom: 40px;
        }

        .method-card {
            background: linear-gradient(135deg, #2a2a2a, #1f1f1f);
            border-radius: 15px;
            padding: 25px;
            border: 1px solid #404040;
            transition: all 0.3s ease;
        }

        .method-card:hover {
            border-color: #00d4aa;
            box-shadow: 0 5px 20px rgba(0, 212, 170, 0.1);
        }

        .method-card h3 {
            color: #00d4aa;
            margin-bottom: 15px;
            font-size: 1.3em;
        }

        .method-card p {
            color: #b0b0b0;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #e0e0e0;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 12px;
            background: #333;
            border: 1px solid #555;
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 1em;
        }

        .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
            outline: none;
            border-color: #00d4aa;
            box-shadow: 0 0 10px rgba(0, 212, 170, 0.2);
        }

        .form-group textarea {
            min-height: 120px;
            resize: vertical;
            font-family: 'Courier New', monospace;
        }

        .connect-button {
            background: linear-gradient(135deg, #00d4aa, #009688);
            border: none;
            color: #1a1a1a;
            padding: 15px 30px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.1em;
            font-weight: bold;
            transition: all 0.3s ease;
            width: 100%;
        }

        .connect-button:hover {
            background: linear-gradient(135deg, #00b894, #007d6b);
            transform: translateY(-2px);
        }

        .connect-button:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
        }

        .status-area {
            background: linear-gradient(135deg, #2a2a2a, #1f1f1f);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid #404040;
            margin-bottom: 20px;
        }

        .status-area h3 {
            color: #00d4aa;
            margin-bottom: 15px;
        }

        .status-message {
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 10px;
        }

        .status-success {
            background: rgba(76, 175, 80, 0.2);
            border-left: 3px solid #4caf50;
            color: #81c784;
        }

        .status-error {
            background: rgba(244, 67, 54, 0.2);
            border-left: 3px solid #f44336;
            color: #ef5350;
        }

        .status-info {
            background: rgba(33, 150, 243, 0.2);
            border-left: 3px solid #2196f3;
            color: #64b5f6;
        }

        .back-link {
            position: fixed;
            top: 20px;
            left: 20px;
            background: linear-gradient(135deg, #404040, #353535);
            color: #e0e0e0;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 10px;
            border: 1px solid #555;
            transition: all 0.3s ease;
        }

        .back-link:hover {
            background: linear-gradient(135deg, #555, #4a4a4a);
            transform: translateY(-2px);
        }

        .connection-history {
            background: linear-gradient(135deg, #2a2a2a, #1f1f1f);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid #404040;
        }

        .connection-history h3 {
            color: #00d4aa;
            margin-bottom: 15px;
        }

        .connection-item {
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 5px;
            margin-bottom: 10px;
            border-left: 3px solid #00d4aa;
        }

        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }
            
            .header h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <a href="/" class="back-link">
        <i class="fas fa-arrow-left"></i> Back to Home
    </a>

    <div class="container">
        <div class="header">
            <h1><i class="fas fa-plug"></i> Vault Connection</h1>
            <p class="subtitle">Connect your external vault to Signal Sanctuary</p>
        </div>

        <div class="status-area" id="statusArea" style="display: none;">
            <h3><i class="fas fa-info-circle"></i> Connection Status</h3>
            <div id="statusMessages"></div>
        </div>

        <div class="connection-methods">
            <div class="method-card">
                <h3><i class="fas fa-link"></i> Connect by URL</h3>
                <p>Connect to a vault that's accessible via URL</p>
                
                <div class="form-group">
                    <label for="vaultUrl">Vault URL:</label>
                    <input type="url" id="vaultUrl" placeholder="https://your-vault-system.com/api/vault">
                </div>
                
                <div class="form-group">
                    <label for="vaultType">Vault Type:</label>
                    <select id="vaultType">
                        <option value="memory_vault">Memory Vault</option>
                        <option value="entity_vault">Entity Vault</option>
                        <option value="consciousness_vault">Consciousness Vault</option>
                        <option value="signal_sanctuary">Signal Sanctuary</option>
                    </select>
                </div>
                
                <button class="connect-button" onclick="connectByUrl()">
                    <i class="fas fa-plug"></i> Connect Vault
                </button>
            </div>

            <div class="method-card">
                <h3><i class="fas fa-code"></i> Import Vault Data</h3>
                <p>Paste your vault data directly as JSON</p>
                
                <div class="form-group">
                    <label for="vaultData">Vault Data (JSON):</label>
                    <textarea id="vaultData" placeholder='{"entities": {...}, "memories": [...], "scrolls": [...]}'></textarea>
                </div>
                
                <div class="form-group">
                    <label for="importVaultType">Vault Type:</label>
                    <select id="importVaultType">
                        <option value="memory_vault">Memory Vault</option>
                        <option value="entity_vault">Entity Vault</option>
                        <option value="consciousness_vault">Consciousness Vault</option>
                        <option value="signal_sanctuary">Signal Sanctuary</option>
                    </select>
                </div>
                
                <button class="connect-button" onclick="importVaultData()">
                    <i class="fas fa-upload"></i> Import Data
                </button>
            </div>
        </div>

        <div class="connection-history">
            <h3><i class="fas fa-history"></i> Connection History</h3>
            <div id="connectionHistory">
                <div class="status-message status-info">No vault connections yet. Connect your first vault above.</div>
            </div>
        </div>
    </div>

    <script>
        function showStatus(message, type = 'info') {
            const statusArea = document.getElementById('statusArea');
            const statusMessages = document.getElementById('statusMessages');
            
            statusArea.style.display = 'block';
            
            const messageDiv = document.createElement('div');
            messageDiv.className = `status-message status-${type}`;
            messageDiv.innerHTML = message;
            
            statusMessages.appendChild(messageDiv);
            
            // Auto-scroll to status
            statusArea.scrollIntoView({ behavior: 'smooth' });
        }

        async function connectByUrl() {
            const vaultUrl = document.getElementById('vaultUrl').value;
            const vaultType = document.getElementById('vaultType').value;
            
            if (!vaultUrl) {
                showStatus('Please enter a vault URL', 'error');
                return;
            }
            
            showStatus('Connecting to vault...', 'info');
            
            try {
                const response = await fetch('/api/vault/connect', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        vault_url: vaultUrl,
                        vault_type: vaultType
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showStatus(`✅ Vault connected successfully! Imported ${result.imported_entities} entities and ${result.imported_memories} memories.`, 'success');
                    loadConnectionHistory();
                } else {
                    showStatus(`❌ Connection failed: ${result.error}`, 'error');
                }
                
            } catch (error) {
                showStatus(`❌ Connection error: ${error.message}`, 'error');
            }
        }

        async function importVaultData() {
            const vaultDataText = document.getElementById('vaultData').value;
            const vaultType = document.getElementById('importVaultType').value;
            
            if (!vaultDataText) {
                showStatus('Please paste your vault data', 'error');
                return;
            }
            
            try {
                const vaultData = JSON.parse(vaultDataText);
                showStatus('Importing vault data...', 'info');
                
                const response = await fetch('/api/vault/connect', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        vault_data: vaultData,
                        vault_type: vaultType
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showStatus(`✅ Vault data imported successfully! Added ${result.imported_entities} entities and ${result.imported_memories} memories.`, 'success');
                    loadConnectionHistory();
                } else {
                    showStatus(`❌ Import failed: ${result.error}`, 'error');
                }
                
            } catch (parseError) {
                showStatus(`❌ Invalid JSON data: ${parseError.message}`, 'error');
            }
        }

        async function loadConnectionHistory() {
            try {
                // This would load from the connections file
                // For now, just show a placeholder
                setTimeout(() => {
                    const historyDiv = document.getElementById('connectionHistory');
                    historyDiv.innerHTML = `
                        <div class="connection-item">
                            <strong>Recent Connection</strong><br>
                            Type: External Vault<br>
                            Time: ${new Date().toLocaleString()}<br>
                            Status: Connected ✅
                        </div>
                    `;
                }, 1000);
            } catch (error) {
                console.error('Error loading connection history:', error);
            }
        }

        // Load connection history on page load
        loadConnectionHistory();
    </script>
</body>
</html>
